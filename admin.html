<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MF 발주 검수</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}
    main{max-width:850px;margin:auto;padding:16px}
    section{background:white;border:1px solid #d5dce3;border-radius:12px;padding:18px;margin:14px 0}
    h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:0}
    label{display:block;font-weight:700;margin:12px 0 5px}
    input,select,textarea,button{font:inherit;box-sizing:border-box}
    input[type=date],input[type=text],input[type=number],select,textarea{width:100%;padding:11px;border:1px solid #aeb9c3;border-radius:7px}
    textarea{min-height:145px;resize:vertical}
    button{border:0;border-radius:7px;padding:11px 15px;background:#175caa;color:white;cursor:pointer}
    button:disabled{background:#87939d;cursor:not-allowed}
    button.secondary{background:#455565}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .line{border:1px solid #cad3dc;border-radius:8px;padding:12px;margin:9px 0}
    .line.flag{border-color:#b45309;background:#fff8ed}
    .line .fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
    .hint{font-size:.88rem;color:#526272}.error{color:#a52222}.ok{color:#166534}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:10px}
    @media(max-width:540px){.row,.line .fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>MF 발주 입력 · 검수</h1>
  <section>
    <h2>1. 날짜와 시간대</h2>
    <div class="row">
      <div><label for="date">발주 날짜</label><input id="date" type="date"></div>
      <div><label for="slot">입력 시간대</label><select id="slot">
        <option value="1_slot_8">8시 최초입력</option>
        <option value="2_slot_10">10시 추가</option>
        <option value="3_slot_12">12시 추가</option>
        <option value="4_slot_13">13시 최종마감</option>
      </select></div>
    </div>
    <p id="existing" class="hint">기존 입력을 확인하는 중…</p>
  </section>
  <section>
    <h2>2. ChatGPT 추출 결과 붙여넣기</h2>
    <p class="hint">발주 화면 사진을 ChatGPT에 올려 품목명과 건수를 추출한 뒤 아래에 붙여넣으세요. 불확실한 값은 ChatGPT가 ‘확인 필요’로 표시하도록 요청하고, 저장 전 원본 사진과 대조하세요.</p>
    <label for="raw">추출한 내용</label>
    <textarea id="raw" placeholder="손질백조기 500g : 3건&#10;생물 대합 600g : 취소 1건"></textarea>
    <div class="actions"><button id="parse" type="button">검수표 만들기</button></div>
  </section>
  <section>
    <h2>3. 품목과 수량 확인</h2>
    <p class="hint">한 줄씩 수정하고 확인을 체크하세요. 읽지 못한 줄은 삭제하거나 직접 수정해야 합니다. 중복 품목은 합치지 않고 오류로 표시합니다.</p>
    <div id="review"></div>
    <button id="add" class="secondary" type="button">품목 한 줄 추가</button>
    <p id="validation" role="status"></p>
  </section>
  <section>
    <h2>4. 저장 전 대조</h2>
    <pre id="preview">검수표를 만들면 저장 내용이 표시됩니다.</pre>
    <label><input id="replace" type="checkbox"> 이 날짜·시간대의 기존 입력 전체를 위 내용으로 교체하는 것을 확인했습니다.</label>
    <div class="actions"><button id="save" type="button" disabled>검수 완료 후 Firebase 저장</button></div>
    <p id="save-status" role="status"></p>
  </section>
</main>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyCCpgZGJ21HdGs36tGuvZgF7sPIbRXNPr0",
  authDomain:"coupang-mf.firebaseapp.com",
  databaseURL:"https://coupang-mf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"coupang-mf",
  storageBucket:"coupang-mf.firebasestorage.app",
  messagingSenderId:"12362663151",
  appId:"1:12362663151:web:51e7acce47f166a88b871a",
  measurementId:"G-JBKQVKJXRE"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const $=id=>document.getElementById(id);
const labels={"1_slot_8":"8시 최초입력","2_slot_10":"10시 추가","3_slot_12":"12시 추가","4_slot_13":"13시 최종마감"};
const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
$("date").value=today;
let existing=null, existingLoaded=false, busy=false, lines=[];
function path(){return "mf_orders/"+$("date").value+"/slots/"+$("slot").value}
function validDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)}
async function loadExisting(){
  existingLoaded=false; existing=null; $("existing").textContent="기존 입력을 확인하는 중…"; validate();
  if(!validDate($("date").value)){$("existing").textContent="날짜를 선택하세요.";return}
  try{
    const snap=await db.ref(path()).once("value");
    existing=snap.val(); existingLoaded=true;
    $("existing").textContent=existing ? "기존 입력: "+JSON.stringify(existing.items||{}) : "이 시간대에 저장된 입력이 없습니다.";
  }catch(e){$("existing").textContent="기존 입력을 읽지 못했습니다: "+e.message}
  validate();
}
function parseLine(raw){
  const source=raw.trim();
  const match=source.match(/^\s*[-•*]?\s*(.+?)\s*[:：]\s*(취소\s*|[-−]\s*)?(\d+)\s*건?\s*$/);
  if(!match) return {source,name:"",qty:"",confirmed:false};
  return {source,name:match[1].trim(),qty:String(Number(match[3])*(match[2]?-1:1)),confirmed:false};
}
function render(){
  const box=$("review");box.replaceChildren();
  lines.forEach((line,i)=>{
    const item=document.createElement("div");item.className="line"+(line.name&&line.qty!==""?"":" flag");
    const src=document.createElement("div");src.className="hint";src.textContent="원문: "+(line.source||"(직접 추가)");item.append(src);
    const fields=document.createElement("div");fields.className="fields";
    const name=document.createElement("input");name.type="text";name.placeholder="품목명";name.value=line.name;
    const qty=document.createElement("input");qty.type="number";qty.step="1";qty.placeholder="건수";qty.value=line.qty;
    name.addEventListener("input",()=>{line.name=name.value.trim();line.confirmed=false;check.checked=false;validate()});
    qty.addEventListener("input",()=>{line.qty=qty.value;line.confirmed=false;check.checked=false;validate()});
    fields.append(name,qty);item.append(fields);
    const check=document.createElement("input");check.type="checkbox";check.checked=line.confirmed;
    check.addEventListener("change",()=>{line.confirmed=check.checked;validate()});
    const checkLabel=document.createElement("label");checkLabel.append(check,document.createTextNode(" 원본 사진 또는 발주 내용과 대조했습니다"));item.append(checkLabel);
    const remove=document.createElement("button");remove.type="button";remove.className="secondary";remove.textContent="이 줄 삭제";
    remove.addEventListener("click",()=>{lines.splice(i,1);render()});item.append(remove);box.append(item);
  });
  validate();
}
function result(){
  const items={},errors=[],seen=new Set();
  if(!lines.length)errors.push("품목을 한 줄 이상 입력하세요.");
  lines.forEach((line,i)=>{
    const name=line.name.trim(),qty=Number(line.qty);
    if(!name)errors.push((i+1)+"행의 품목명이 비어 있습니다.");
    if(line.qty===""||!Number.isSafeInteger(qty)||qty===0)errors.push((i+1)+"행의 건수를 확인하세요.");
    if(seen.has(name))errors.push((i+1)+"행의 품목명이 중복됩니다.");else seen.add(name);
    if(!line.confirmed)errors.push((i+1)+"행을 원본과 대조해 확인하세요.");
    if(name&&Number.isSafeInteger(qty)&&qty!==0)items[name]=qty;
  });
  return {items,errors};
}
function validate(){
  const {items,errors}=result();
  if(!validDate($("date").value))errors.push("발주 날짜를 선택하세요.");
  if(!existingLoaded)errors.push("기존 입력 조회가 완료되지 않았습니다.");
  if(!$("replace").checked)errors.push("전체 교체를 확인하세요.");
  $("validation").textContent=errors.join(" ")||"모든 항목을 검수했습니다.";
  $("validation").className=errors.length?"error":"ok";
  $("preview").textContent=JSON.stringify({date:$("date").value,slot:labels[$("slot").value],before:existing?.items||null,after:items},null,2);
  $("save").disabled=busy||errors.length>0;
}
$("date").addEventListener("change",()=>{ $("replace").checked=false;loadExisting() });
$("slot").addEventListener("change",()=>{ $("replace").checked=false;loadExisting() });
$("replace").addEventListener("change",validate);
$("parse").addEventListener("click",()=>{
  lines=$("raw").value.split(/\r?\n/).filter(s=>s.trim()).map(parseLine);$("replace").checked=false;render();
});
$("add").addEventListener("click",()=>{lines.push({source:"",name:"",qty:"",confirmed:false});render()});
$("save").addEventListener("click",async()=>{
  validate();if($("save").disabled)return;
  const {items}=result(),slot=$("slot").value,date=$("date").value;
  busy=true;validate();$("save-status").textContent="저장 중…";
  try{
    const dayRef=db.ref("mf_orders/"+date);
    const savedAt=new Date().toISOString();
    const tx=await dayRef.transaction(day=>{
      const current=day?.slots?.[slot] ?? null;
      if(JSON.stringify(current)!==JSON.stringify(existing))return;
      day=day||{};
      day.slots=day.slots||{};
      day.slots[slot]={label:labels[slot],items,updatedAt:savedAt};
      const latestSlot=Object.keys(day.slots).sort().at(-1);
      day.lastStatus=labels[latestSlot]||labels[slot];
      return day;
    });
    if(!tx.committed)throw new Error("검수 중 기존 입력이 바뀌었습니다. 다시 불러와 확인하세요.");
    $("save-status").textContent="저장했습니다.";lines=[];$("raw").value="";$("replace").checked=false;render();await loadExisting();
  }catch(e){$("save-status").textContent="저장 실패: "+e.message;await loadExisting()}
  finally{busy=false;validate()}
});
loadExisting();
</script>
</body>
</html>
