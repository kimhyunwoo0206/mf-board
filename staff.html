<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사진으로 발주 입력</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-functions-compat.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font:16px system-ui,'Malgun Gothic',sans-serif}
    main{max-width:800px;margin:auto;padding:20px}h1{font-size:26px}h2{font-size:19px}section{background:white;padding:20px;border:1px solid #d5dce3;border-radius:12px;margin:16px 0}
    label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{font:inherit}input[type=date],input[type=number],select{padding:10px;width:100%;border:1px solid #aeb9c3;border-radius:6px}
    button{min-height:52px;padding:12px 18px;border:0;border-radius:8px;background:#175caa;color:white;font-weight:700;cursor:pointer;margin:10px 0}button:disabled{background:#87939d;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{color:#526272;font-size:14px;line-height:1.6}.status{white-space:pre-wrap;line-height:1.6}.error{color:#a52222}
    img{max-width:100%;max-height:350px;object-fit:contain;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e2e5ea}td:last-child,th:last-child{text-align:right}
    a{color:#175caa}#warnings{white-space:pre-wrap;color:#a52222}label.check{font-weight:400;line-height:1.6;padding:14px;background:#eef5ff;border-radius:8px}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}#analyze,#transfer{width:100%;font-size:19px}input[type=file]{width:100%;padding:16px;border:2px dashed #aeb9c3;border-radius:8px}details{font-size:14px;color:#526272}section[hidden]{display:none}@media(max-width:540px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>사진으로 발주 입력</h1>
  <p class="hint">① 사진 고르기 → ② 숫자 확인하기 → ③ 발주 화면으로 보내기</p>
  <section><h2>처음 한 번만 로그인해 주세요</h2><p id="account">로그인 상태 확인 중…</p><button id="login">Google로 시작하기</button><button id="logout" hidden>로그아웃</button></section>
  <section><h2>① 발주 사진을 골라 주세요</h2>
    <div class="row"><div><label for="date">발주 날짜</label><input id="date" type="date"></div><div><label for="slot">발주 시간</label><select id="slot"><option value="1_slot_8">8시</option><option value="2_slot_10">10시</option><option value="3_slot_12">12시</option><option value="4_slot_13">13시 (마감)</option></select></div></div>
    <label for="photo">사진 선택</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    <p class="hint">상품 이름과 숫자가 잘 보이는 사진 한 장을 골라 주세요. 아래에서 사진을 확인할 수 있어요. <details><summary>사진 이용 안내</summary>JPG·PNG·WEBP, 5MB 이하. 사진은 숫자를 읽기 위해 OpenAI로 보내집니다.</details></p>
    <img id="preview" hidden alt="선택한 발주 사진"><br><button id="analyze" disabled>사진에서 숫자 읽기</button><p id="status" class="status" role="status"></p>
  </section>
  <section id="result" hidden><h2>② 사진과 숫자를 비교해 주세요</h2><p id="warnings"></p><table><thead><tr><th>품목</th><th>수량</th></tr></thead><tbody id="rows"></tbody></table><p id="sum"></p>
    <label for="expected">사진 맨 아래의 총합은 몇 개인가요?</label><input id="expected" type="number" min="1" step="1">
    <label class="check"><input id="checked" type="checkbox"> 사진과 아래 목록을 비교했어요. 상품과 숫자가 모두 맞아요.</label>
    <button id="transfer" disabled>③ 발주 화면으로 보내기</button><p class="hint">다음 화면에서 한 번 더 확인하고 ‘저장’을 누르면 끝나요.</p>
  </section><p><a href="admin.html">직접 숫자 입력하기</a> · <a href="index.html">작업지시서 보기</a></p>
</main><script>
firebase.initializeApp({apiKey:'AIzaSyCCpgZGJ21HdGs36tGuvZgF7sPIbRXNPr0',authDomain:'coupang-mf.firebaseapp.com',projectId:'coupang-mf'});
const auth=firebase.auth(), fn=firebase.app().functions('asia-southeast1').httpsCallable('extractMfOrder',{timeout:120000});
const $=id=>document.getElementById(id);
let image=null, result=null, busy=false, previewUrl=null;
const approved=()=>auth.currentUser?.email==='youngmooff@gmail.com'&&auth.currentUser.emailVerified;
function state(){
  $('analyze').disabled=busy||!image||!approved();
  $('transfer').disabled=busy||!result||result.needsReview||!approved()||!$('checked').checked||Number($('expected').value)!==result.total;
}
function reset(){result=null;$('result').hidden=true;$('checked').checked=false;$('expected').value='';state();}
$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
auth.onAuthStateChanged(user=>{
  $('account').textContent=user?(approved()?user.email+' · 준비됐어요':'이 계정은 시험 사용 권한이 없습니다.'):'먼저 아래 버튼을 눌러 로그인해 주세요.';
  $('login').hidden=!!user;$('logout').hidden=!user;reset();
});
$('login').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('status').textContent='로그인이 되지 않았어요. 팝업을 허용한 뒤 ‘Google로 시작하기’를 다시 눌러 주세요.'}};
$('logout').onclick=()=>auth.signOut();
$('photo').onchange=async()=>{
  reset();image=null;$('status').textContent='';if(previewUrl)URL.revokeObjectURL(previewUrl);$('preview').hidden=true;
  const file=$('photo').files[0];if(!file){state();return}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5000000){$('status').textContent='JPG·PNG·WEBP 사진(5MB 이하)을 선택하세요.';state();return}
  const selected=file;
  const reader=new FileReader();reader.onload=()=>{if($('photo').files[0]!==selected)return;image=reader.result;previewUrl=URL.createObjectURL(file);$('preview').src=previewUrl;$('preview').hidden=false;state()};reader.readAsDataURL(file);
};
$('analyze').onclick=async()=>{
  if(busy||!approved()||!image)return;reset();busy=true;state();$('photo').disabled=true;$('status').textContent='사진에서 숫자를 읽고 있어요. 잠시만 기다려 주세요…';
  try{
    const response=await fn({image});result=response.data;$('rows').replaceChildren();
    result.rows.forEach(item=>{const tr=document.createElement('tr');[item.name,String(item.quantity)].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});$('rows').append(tr)});
    $('warnings').textContent=result.warnings.join('\n');$('sum').textContent=`읽은 수량 합계: ${result.total}건 · 사진에 적힌 총합: ${result.sourceTotal===null?'직접 확인해 주세요':result.sourceTotal+'건'}`;
    $('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'start'});$('status').textContent=result.needsReview?'사진에서 못 읽은 부분이 있어요. 더 선명한 사진을 고르거나 ‘직접 숫자 입력하기’를 눌러 주세요.':'숫자를 읽었어요! 사진과 목록을 비교한 뒤, 사진의 총합을 입력해 주세요.';
  }catch(e){$('status').textContent='숫자를 읽지 못했어요. 잠시 후 다시 눌러 주세요. 계속 안 되면 ‘직접 숫자 입력하기’를 이용해 주세요.'}finally{busy=false;$('photo').disabled=false;state()}
};
['expected','checked','date','slot'].forEach(id=>$(id).addEventListener('change',state));$('expected').addEventListener('input',state);
$('transfer').onclick=()=>{
  state();if($('transfer').disabled)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test($('date').value)){$('status').textContent='발주 날짜를 선택하세요.';return}
  sessionStorage.setItem('mf-reviewed-order',JSON.stringify({date:$('date').value,slot:$('slot').value,text:result.rows.map(r=>`${r.name} : ${r.quantity}건`).join('\n')}));location.href='admin.html';
};
</script></body></html>
