<style>
:root{color-scheme:light;font-family:system-ui,'Malgun Gothic',sans-serif}

h1{font-size:clamp(1.25rem,5vw,1.8rem);margin:0}#order-date{font:inherit;font-size:1rem;padding:10px;border:2px solid #657b8e;border-radius:8px;min-height:44px;background:#fff;color:#10202e}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.status-banner{display:inline-block;font-size:1rem;font-weight:800;background:#d8e9ff;color:#0d4c89;padding:8px 12px;border-radius:8px}.closed{background:#ffe1dd;color:#9b2a1b}.grand-total{font-size:1rem;font-weight:700;white-space:nowrap}.grand-total strong{font-size:clamp(2rem,8vw,3rem);color:#ae3b00;line-height:1}.updated{font-size:.88rem;color:#4d6475;margin:7px 0 0}.section-title{font-size:1.25rem;margin:14px 0 10px}
.work-table-wrap{overflow-x:auto;background:#fff;border:2px solid #aebdca;border-radius:10px}.work-table{width:100%;min-width:720px;border-collapse:collapse;font-variant-numeric:tabular-nums}.work-table th,.work-table td{border:1px solid #b8c5cf;padding:10px 8px;text-align:center}.work-table thead th{position:sticky;top:0;background:#173e63;color:#fff;font-size:1rem}.work-table .group{width:88px;background:#dceaf5;color:#123f6d;font-size:1.05rem;font-weight:900}.work-table .product{text-align:left;min-width:230px;font-size:1.05rem;font-weight:750}.work-table .slot{width:74px;font-size:1.12rem;font-weight:750}.work-table .total{width:86px;background:#fff2cf;color:#9d3500;font-size:1.45rem;font-weight:950}.work-table tr.group-start td,.work-table tr.group-start th{border-top:3px solid #6c8295}.zero{color:#a2adb5;font-weight:400}.cancel{color:#b3261e}.empty{padding:28px;text-align:center;color:#526272;background:#fff;border-radius:10px}.print-note{display:none}.mobile-label{display:none}
@media(max-width:650px){.top-inner{padding:10px 8px}.top-line{align-items:stretch;flex-direction:column;gap:7px}.controls{align-items:stretch}.controls label{flex:1}#order-date{width:100%;padding:7px;min-height:40px}.print-button,.admin-button{min-height:40px;padding:7px 10px}.summary{margin-top:8px}.status-banner{padding:6px 8px;font-size:.84rem}.grand-total{font-size:.82rem}.grand-total strong{font-size:1.8rem}.updated{font-size:.72rem;margin-top:4px}main{padding:6px 3px}.section-title{margin:8px 3px 6px;font-size:1rem}.work-table-wrap{overflow-x:hidden;border-width:1px;border-radius:6px}.work-table{width:100%;min-width:0;table-layout:fixed}.work-table th,.work-table td{padding:6px 2px;line-height:1.15;overflow-wrap:anywhere}.work-table thead th{font-size:.68rem}.work-table thead th:nth-child(1){width:12%}.work-table thead th:nth-child(2){width:31%}.work-table thead th:nth-child(n+3):nth-child(-n+6){width:9%}.work-table thead th:nth-child(7){width:12%}.work-table .group{width:auto;font-size:.75rem}.work-table .product{min-width:0;font-size:.76rem;letter-spacing:-.03em}.work-table .slot{width:auto;font-size:.88rem}.work-table .total{width:auto;font-size:1rem}.desktop-label{display:none}.mobile-label{display:inline}}
@media print{@page{size:A4 portrait;margin:9mm}body{background:#fff;color:#000}.top{position:static;box-shadow:none;border:0}.top-inner,main{max-width:none;padding:0}.controls{display:none!important}h1{font-size:18pt;text-align:center}.summary{margin:5mm 0 2mm}.status-banner{border:1px solid #000;background:#fff;color:#000;padding:4px 8px}.grand-total strong{color:#000;font-size:24pt}.updated{text-align:right;color:#000}.section-title{margin:3mm 0 2mm;font-size:14pt}.work-table-wrap{overflow:visible;border:1px solid #000;border-radius:0}.work-table{min-width:0}.work-table th,.work-table td{border:1px solid #000;padding:5px 4px}.work-table thead th{position:static;background:#e5e5e5!important;color:#000;font-size:10pt}.work-table .group{background:#eee!important;color:#000;font-size:10pt}.work-table .product{min-width:0;font-size:10pt}.work-table .slot{width:13%;font-size:11pt}.work-table .total{width:14%;background:#f3f3f3!important;color:#000;font-size:13pt}.print-note{display:block;margin-top:3mm;font-size:9pt}}
@media print{@page{size:A4 portrait;margin:8mm}.top-inner{padding:0}h1{font-size:15pt;margin:0}.top-line{margin:0}.summary{margin:2mm 0 1mm}.status-banner{padding:2px 6px;font-size:9pt}.grand-total{font-size:9pt}.grand-total strong{font-size:16pt}.updated{margin:1mm 0 0;font-size:8pt}.section-title{display:none}.work-table th,.work-table td{padding:1.1mm 1mm;line-height:1.15}.work-table thead th{font-size:9pt}.work-table .group{font-size:8.5pt;width:17mm;white-space:nowrap}.work-table .product{font-size:9.5pt}.work-table .slot{width:11mm;font-size:10pt}.work-table .total{width:16mm;font-size:11.5pt}.work-table tr.group-start td,.work-table tr.group-start th{border-top:1.5px solid #000}.clickable{text-decoration:none}.work-table tr{break-inside:avoid;page-break-inside:avoid}.print-note{font-size:7.5pt;margin-top:1.5mm}.dt-back{display:none!important}}
@media print{.work-table{table-layout:fixed;width:100%}.work-table thead th:nth-child(1){width:19mm}.work-table thead th:nth-child(2){width:auto}.work-table thead th:nth-child(n+3):nth-child(-n+6){width:15mm}.work-table thead th:nth-child(7){width:15mm}.work-table thead th:nth-child(8){width:21mm}.work-table th,.work-table td{padding:.7mm 1mm;line-height:1.12}.work-table thead th{font-size:10.5pt}.work-table .group{font-size:10pt;width:auto;white-space:normal;font-weight:900}.work-table .product{font-size:11pt;font-weight:800;text-align:left;padding-left:2.5mm}.work-table .slot{font-size:11.5pt;width:auto}.work-table .total{font-size:13pt;width:auto}h1{font-size:16pt}
body.pr-m .work-table th,body.pr-m .work-table td{padding:1mm 1mm}body.pr-m .work-table .product{font-size:12pt}body.pr-m .work-table .slot{font-size:12.5pt}body.pr-m .work-table .total{font-size:14.5pt}body.pr-m .work-table .group{font-size:10.5pt}
body.pr-l .work-table th,body.pr-l .work-table td{padding:1.6mm 1mm}body.pr-l .work-table .product{font-size:14pt}body.pr-l .work-table .slot{font-size:15pt}body.pr-l .work-table .total{font-size:17pt}body.pr-l .work-table .group{font-size:12pt}body.pr-l .work-table thead th{font-size:12pt}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
<div class="top-line"><h1 id="today-date">MF 현장 작업지시서</h1><div class="controls"><label for="order-date">조회 날짜 <input id="order-date" type="date"></label><a class="admin-button" href="admin.html">수동입력</a><a class="admin-button" href="stock.html">현재고</a><a class="admin-button" href="report.html">기간 집계</a><button class="print-button" type="button" onclick="window.print()">인쇄</button></div></div>
<div class="summary"><div id="status-banner" class="status-banner" role="status">데이터 대기 중...</div><div class="grand-total">실출고 순건수 <strong id="grand-total">—</strong>건</div></div>
<p id="updated" class="updated"></p>
</div></header>
<main><h2 class="section-title">품목군별 작업수량</h2><div id="work-order"></div><p class="print-note">※ 1차·2차·3차·4차는 각 차수 추가 발주수량이며, 취소는 배치 생성 후 취소된 수량이며, 실출고(누적)는 당일 발주 합계에서 취소를 뺀 수량입니다.</p></main>
<script>
const firebaseConfig={apiKey:"AIzaSyCCpgZGJ21HdGs36tGuvZgF7sPIbRXNPr0",authDomain:"coupang-mf.firebaseapp.com",databaseURL:"https://coupang-mf-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"coupang-mf",storageBucket:"coupang-mf.firebasestorage.app",messagingSenderId:"12362663151",appId:"1:12362663151:web:51e7acce47f166a88b871a",measurementId:"G-JBKQVKJXRE"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
function getTodayKST(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function validDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)}
function decodeItemKey(key){if(!String(key).startsWith("k_"))return key;try{let b64=String(key).slice(2).replace(/-/g,"+").replace(/_/g,"/");while(b64.length%4)b64+="=";const binary=atob(b64);return new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0)))}catch(e){return key}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char])}
const dateInput=document.getElementById('order-date');const qp=new URLSearchParams(location.search);const queryDate=qp.get('date');dateInput.value=validDate(queryDate||'')?queryDate:getTodayKST();
let activeRef=null,lastData=null,catalogBarcodes=null;
const slotOrder=['1_slot_8','2_slot_10','3_slot_12','4_slot_13'];
const slotHeadings={'1_slot_8':'1차','2_slot_10':'2차','3_slot_12':'3차','4_slot_13':'4차'};
const slotStatusLabels={'1_slot_8':'1차 반영','2_slot_10':'2차 반영','3_slot_12':'3차 반영','4_slot_13':'4차 마감'};
const {catalog,displayNames}=MfGroups;
function showDate(){
 if(activeRef)activeRef.off();const selectedDate=dateInput.value;if(!validDate(selectedDate))return;document.getElementById('today-date').innerText=`${selectedDate} MF 현장 작업지시서`;document.querySelector('.admin-button').href=`admin.html?date=${encodeURIComponent(selectedDate)}`;activeRef=db.ref('mf_orders/'+selectedDate);
 activeRef.on('value',snapshot=>{
  const data=snapshot.val();lastData=data;const workOrderEl=document.getElementById('work-order'),statusBanner=document.getElementById('status-banner'),grandTotalEl=document.getElementById('grand-total'),updatedEl=document.getElementById('updated');workOrderEl.replaceChildren();grandTotalEl.textContent='0';updatedEl.textContent='';
  if(data&&data.slots){
   const latestSlot=[...slotOrder].reverse().find(key=>data.slots[key]);statusBanner.innerText=slotStatusLabels[latestSlot]||'진행 중';statusBanner.classList.toggle('closed',latestSlot==='4_slot_13');
   const byItem={},byCancel={};let grandTotalCount=0,latestUpdate='';
   slotOrder.forEach(key=>{const slotData=data.slots[key];if(!slotData)return;if(slotData.updatedAt>latestUpdate)latestUpdate=slotData.updatedAt;for(const [storedKey,count] of Object.entries(slotData.items||{})){const name=decodeItemKey(storedKey),val=Number(count)||0;if(!byItem[name])byItem[name]={};byItem[name][key]=(byItem[name][key]||0)+val;grandTotalCount+=val}});
   for(const c of Object.values(data.cancelled||{}))for(const l of (c&&c.lines)||[]){const q=Number(l.qty)||0;if(!q)continue;byCancel[l.name]=(byCancel[l.name]||0)+q;if(!byItem[l.name])byItem[l.name]={};grandTotalCount-=q}
   const known=new Set(catalog.flatMap(g=>g.items));const groups=catalog.map(g=>({group:g.group,items:g.items.filter(name=>Object.prototype.hasOwnProperty.call(byItem,name))})).filter(g=>g.items.length);const unknown=Object.keys(byItem).filter(name=>!known.has(name)).sort((a,b)=>a.localeCompare(b,'ko'));if(unknown.length)groups.push({group:'기타',items:unknown});
   if(!groups.length)workOrderEl.innerHTML='<div class="empty">표시할 품목이 없습니다.</div>';else{
    let html='<div class="work-table-wrap"><table class="work-table"><thead><tr><th><span class="desktop-label">품목군</span><span class="mobile-label">군</span></th><th><span class="desktop-label">상품명</span><span class="mobile-label">품목</span></th>'+slotOrder.map(k=>`<th>${slotHeadings[k]}</th>`).join('')+'<th>취소</th><th>실출고<br>(누적)</th></tr></thead><tbody>';
    groups.forEach(group=>group.items.forEach((name,index)=>{const values=slotOrder.map(k=>Number(byItem[name]?.[k])||0),cancelQty=byCancel[name]||0,total=values.reduce((s,v)=>s+v,0)-cancelQty;html+=`<tr class="${index===0?'group-start':''}">`;if(index===0)html+=`<th class="group" rowspan="${group.items.length}">${escapeHtml(group.group)}</th>`;html+=`<td class="product">${escapeHtml(displayNames[name]||name)}</td>`+values.map((v,i)=>`<td class="slot ${v===0?'zero':v<0?'cancel':''}${v!==0?' clickable':''}"${v!==0?` data-name="${escapeHtml(name)}" data-slot="${slotOrder[i]}" title="눌러서 배치 ID·운송장 번호 보기"`:''}>${v===0?'—':v}</td>`).join('')+`<td class="slot ${cancelQty?'cancel clickable':'zero'}"${cancelQty?` data-name="${escapeHtml(name)}" data-slot="cancel" title="눌러서 취소된 운송장 번호 보기"`:''}>${cancelQty?'−'+cancelQty:'—'}</td><td class="total ${total<0?'cancel':''}">${total}</td></tr>`}));html+='</tbody></table></div>';workOrderEl.innerHTML=html;
   }
   grandTotalEl.textContent=String(grandTotalCount);if(latestUpdate)updatedEl.textContent='마지막 반영: '+new Date(latestUpdate).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});
  }else{statusBanner.innerText='아직 등록된 발주가 없습니다.';statusBanner.classList.remove('closed')}
 },error=>{document.getElementById('status-banner').innerText='데이터를 읽지 못했습니다: '+error.message;document.getElementById('grand-total').textContent='—'});
}

const detailCss=document.createElement('style');detailCss.textContent='.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.clickable:hover{background:#eef5ff}.dt-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.dt-box{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:16px}.dt-box h3{margin:0 0 4px;font-size:1.05rem}.dt-box p{margin:4px 0 10px;color:#4a5b6b;font-size:.88rem}.dt-box table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.dt-box th,.dt-box td{border:1px solid #cfd8e0;padding:6px 8px;text-align:left;font-size:.92rem}.dt-box th{background:#f1f5f9}.dt-box tr.canceled td{color:#b42318;text-decoration:line-through}.dt-btns{display:flex;gap:8px;margin-top:12px}.dt-btns button{flex:1;padding:10px;font-size:1rem;border:0;border-radius:8px;background:#0d4c89;color:#fff}.dt-btns .sec{background:#64748b}@media print{.dt-back{display:none}}';document.head.appendChild(detailCss);
async function barcodeOf(name){if(!catalogBarcodes){try{const r=await fetch('./functions/catalog.json',{cache:'no-cache'});catalogBarcodes=r.ok?await r.json():[]}catch(e){catalogBarcodes=[]}}return (catalogBarcodes.find(x=>x.name===name)||{}).barcode||''}
async function showShipDetail(name,slotKey){
 const data=lastData;if(!data)return;const rows=[];let note='',title=name+' · ';
 const doneKeys=new Map();for(const [id,c] of Object.entries(data.cancelled||{})){doneKeys.set(id,c);for(const k of (c&&c.keys)||[])doneKeys.set(k,c)}
 if(slotKey==='cancel'){
  title+='취소';
  for(const [id,c] of Object.entries(data.cancelled||{}))for(const l of (c&&c.lines)||[])if(l.name===name)rows.push({batch:'',ship:'',wb:(c.keys&&c.keys[0])||id,qty:Number(l.qty)||0,canceled:true,tag:(slotHeadings[c.from]||'')+(c.manual?' · 직접 등록':'')});
 }else{
  title+=(slotHeadings[slotKey]||'')+' 발주';
  const bc=await barcodeOf(name),slot=(data.slots||{})[slotKey]||{};
  const pick=(lines)=>{for(const part of String(lines).split(',')){const [b,q]=part.split(':');if(b===bc)return Number(q)||0}return 0};
  const det=slot.shipDetail||{};
  if(Object.keys(det).length){
   for(const [key,val] of Object.entries(det)){const [batch,ship,lines]=String(val).split('|');const q=pick(lines||'');if(q)rows.push({batch,ship,wb:/^103\d{11}$/.test(key)?key:'',qty:q,canceled:doneKeys.has(key)||doneKeys.has(ship)})}
  }else{
   const sh=slot.shipments||{},wbKeys=Object.keys(sh).filter(k=>/^103\d{11}$/.test(k)),keys=wbKeys.length?wbKeys:Object.keys(sh);
   for(const key of keys){const q=pick(sh[key]);if(q)rows.push({batch:'',ship:wbKeys.length?'':key,wb:wbKeys.length?key:'',qty:q,canceled:doneKeys.has(key)})}
   note='이 차수는 배치 ID가 저장되기 전에 등록되어 운송장 번호만 표시됩니다.';
  }
  const shown=rows.reduce((s,r)=>s+r.qty,0),cellQty=Number(((data.slots||{})[slotKey]?.items||{})[Object.keys((data.slots||{})[slotKey]?.items||{}).find(k=>decodeItemKey(k)===name)])||0;
  if(!rows.length)note='이 차수에는 저장된 배치 ID·운송장 번호가 없습니다(이 기능 이전에 등록했거나 직접 입력한 수량).';
  else if(shown!==cellQty)note=(note?note+' ':'')+'표시 '+shown+'건 / 차수 수량 '+cellQty+'건 — 나머지는 번호가 저장되지 않은 수량입니다.';
 }
 const body=rows.length?'<table><thead><tr><th>배치 ID</th><th>운송장 번호</th><th>수량</th><th>상태</th></tr></thead><tbody>'+rows.map(r=>`<tr class="${r.canceled&&slotKey!=='cancel'?'canceled':''}"><td>${escapeHtml(r.batch||'—')}</td><td>${escapeHtml(r.wb||r.ship||'—')}</td><td>${r.qty}</td><td>${slotKey==='cancel'?escapeHtml(r.tag||'취소'):r.canceled?'취소':''}</td></tr>`).join('')+'</tbody></table>':'';
 const back=document.createElement('div');back.className='dt-back';
 back.innerHTML=`<div class="dt-box" role="dialog" aria-modal="true"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(note||(rows.length+'건'))}</p>${body}<div class="dt-btns">${rows.length?'<button type="button" id="dt-copy">운송장 번호 복사</button>':''}<button type="button" class="sec" id="dt-close">닫기</button></div></div>`;
 document.body.appendChild(back);const close=()=>back.remove();
 back.addEventListener('click',e=>{if(e.target===back)close()});back.querySelector('#dt-close').addEventListener('click',close);
 const cp=back.querySelector('#dt-copy');if(cp)cp.addEventListener('click',async()=>{const t=rows.map(r=>[r.batch,r.wb||r.ship].filter(Boolean).join('\t')).join('\n');try{await navigator.clipboard.writeText(t);cp.textContent='복사됨'}catch(e){cp.textContent='복사 실패 — 직접 선택하세요'}});
}
document.getElementById('work-order').addEventListener('click',e=>{const td=e.target.closest('td.clickable');if(td&&td.dataset.name)showShipDetail(td.dataset.name,td.dataset.slot)});
function applyPrintDensity(){const n=document.querySelectorAll('#work-order tbody tr').length;document.body.classList.remove('pr-l','pr-m');document.body.style.zoom='';if(n<=20)document.body.classList.add('pr-l');else if(n<=27)document.body.classList.add('pr-m');else if(n>33)document.body.style.zoom=String(Math.max(.55,33/n))}
window.addEventListener('beforeprint',applyPrintDensity);window.addEventListener('afterprint',()=>{document.body.classList.remove('pr-l','pr-m');document.body.style.zoom=''});
dateInput.addEventListener('change',showDate);showDate();
</script>
</body>
</html>
