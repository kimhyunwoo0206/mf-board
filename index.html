<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF 발주 현황</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { color-scheme: light; font-family: system-ui, 'Malgun Gothic', sans-serif; }
        * { box-sizing: border-box; }
        body { background: #f3f6f9; color: #10202e; margin: 0; }
        .top { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 2px solid #c8d3dd; box-shadow: 0 2px 7px #10202e14; }
        .top-inner, main { max-width: 900px; margin: auto; padding: 14px 16px; }
        .top-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        h1 { font-size: clamp(1.25rem, 5vw, 1.8rem); margin: 0; }
        #order-date { font: inherit; font-size: 1rem; padding: 10px; border: 2px solid #657b8e; border-radius: 8px; min-height: 44px; background: #fff; color: #10202e; }
        .summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
        .status-banner { display: inline-block; font-size: 1rem; font-weight: 800; background: #d8e9ff; color: #0d4c89; padding: 8px 12px; border-radius: 8px; }
        .closed { background: #ffe1dd; color: #9b2a1b; }
        .grand-total { font-size: 1rem; font-weight: 700; white-space: nowrap; }
        .grand-total strong { font-size: clamp(2rem, 8vw, 3rem); color: #ae3b00; line-height: 1; }
        .updated { font-size: .88rem; color: #4d6475; margin: 7px 0 0; }
        .section-title { font-size: 1.25rem; margin: 14px 0 10px; }
        .total-list, .history-list { list-style: none; padding: 0; margin: 0; }
        .total-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
        .total-item { background: #fff; border: 2px solid #d0dce5; border-left: 7px solid #1264a3; border-radius: 10px; min-height: 82px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .item-name { font-size: clamp(1.05rem, 3.4vw, 1.35rem); font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
        .total-count { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 900; color: #ae3b00; white-space: nowrap; }
        .history-container { margin-bottom: 30px; }
        .history-slot { background: #fff; border: 1px solid #cdd8e2; border-radius: 9px; margin-bottom: 8px; }
        .history-slot summary { cursor: pointer; min-height: 48px; padding: 12px; font-size: 1rem; font-weight: 750; }
        .history-slot summary span { float: right; color: #0d4c89; }
        .history-list { border-top: 1px solid #d6e0e8; padding: 10px 12px; }
        .history-list li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 1rem; }
        .history-list li span:last-child { white-space: nowrap; font-weight: 700; }
        @media(max-width:650px) { .total-list { grid-template-columns: 1fr; } .top-line { align-items: stretch; flex-direction: column; } #order-date { width: 100%; } }
    </style>
</head>
<body>
    <header class="top"><div class="top-inner">
        <div class="top-line"><h1 id="today-date">MF 발주 현황</h1><label for="order-date">조회 날짜 <input id="order-date" type="date"></label></div>
        <div class="summary"><div id="status-banner" class="status-banner" role="status">데이터 대기 중...</div><div class="grand-total">누적 순건수 <strong id="grand-total">—</strong>건</div></div>
        <p id="updated" class="updated"></p>
    </div></header>
    <main>
        <h2 class="section-title">품목별 합계</h2>
        <ul id="total-list" class="total-list"></ul>
        <h2 class="section-title">시간대별 입력 내역</h2>
        <div id="history-container" class="history-container"></div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCpgZGJ21HdGs36tGuvZgF7sPIbRXNPr0",
            authDomain: "coupang-mf.firebaseapp.com",
            databaseURL: "https://coupang-mf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "coupang-mf",
            storageBucket: "coupang-mf.firebasestorage.app",
            messagingSenderId: "12362663151",
            appId: "1:12362663151:web:51e7acce47f166a88b871a",
            measurementId: "G-JBKQVKJXRE"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // KST(한국 시간) 기준으로 정확한 날짜(YYYY-MM-DD) 구하기
        function getTodayKST() {
            const curr = new Date();
            const utc = curr.getTime() + (curr.getTimezoneOffset() * 60 * 1000);
            const kstGap = 9 * 60 * 60 * 1000;
            const kstDate = new Date(utc + kstGap);
            
            const year = kstDate.getFullYear();
            const month = String(kstDate.getMonth() + 1).padStart(2, '0');
            const day = String(kstDate.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day}`;
        }

        const dateInput = document.getElementById('order-date');
        dateInput.value = getTodayKST();
        let activeRef = null;
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }
        function showDate() {
          if (activeRef) activeRef.off();
          const selectedDate = dateInput.value;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) return;
          document.getElementById('today-date').innerText = `${selectedDate} MF 발주`;
          activeRef = db.ref('mf_orders/' + selectedDate);
          activeRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const totalListEl = document.getElementById('total-list');
            const historyContainerEl = document.getElementById('history-container');
            const statusBanner = document.getElementById('status-banner');
            const grandTotalEl = document.getElementById('grand-total');
            const updatedEl = document.getElementById('updated');
            
            totalListEl.replaceChildren();
            historyContainerEl.replaceChildren();
            grandTotalEl.textContent = '0';
            updatedEl.textContent = '';

            if (data && data.slots) {
                statusBanner.innerText = data.lastStatus || "진행 중";
                if (data.lastStatus && data.lastStatus.includes('마감')) {
                    statusBanner.classList.add('closed');
                } else {
                    statusBanner.classList.remove('closed');
                }

                let totalItems = {}; 
                let grandTotalCount = 0;
                const slotKeys = Object.keys(data.slots).sort();
                let latestUpdate = '';
                
                slotKeys.forEach(key => {
                    const slotData = data.slots[key];
                    const items = slotData.items || {};
                    let slotTotal = 0;
                    if (slotData.updatedAt > latestUpdate) latestUpdate = slotData.updatedAt;
                    
                    for (const [name, count] of Object.entries(items)) {
                        const val = Number(count) || 0;
                        if (!totalItems[name]) totalItems[name] = 0;
                        totalItems[name] += val;
                        grandTotalCount += val;
                        slotTotal += val;
                    }

                    let historyHtml = `<details class="history-slot"><summary>${escapeHtml(slotData.label || key)}<span>${slotTotal}건</span></summary><ul class="history-list">`;
                    for (const [name, count] of Object.entries(items)) {
                        historyHtml += `<li><span>${escapeHtml(name)}</span> <span>${Number(count) || 0}건</span></li>`;
                    }
                    historyHtml += `</ul></details>`;
                    historyContainerEl.insertAdjacentHTML('beforeend', historyHtml);
                });

                for (const [name, count] of Object.entries(totalItems).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'ko'))) {
                    totalListEl.insertAdjacentHTML('beforeend', `
                        <li class="total-item">
                            <span class="item-name">${escapeHtml(name)}</span> 
                            <span class="total-count">${count}건</span>
                        </li>`);
                }
                grandTotalEl.textContent = String(grandTotalCount);
                if (latestUpdate) updatedEl.textContent = '마지막 반영: ' + new Date(latestUpdate).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'});

            } else {
                statusBanner.innerText = "아직 등록된 발주가 없습니다.";
                statusBanner.classList.remove('closed');
            }
          }, error => {
            document.getElementById('status-banner').innerText = '데이터를 읽지 못했습니다: ' + error.message;
            document.getElementById('grand-total').textContent = '—';
          });
        }
        dateInput.addEventListener('change', showDate);
        showDate();
    </script>
</body>
</html>
