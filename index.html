<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MF 발주 현황</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 15px; }
        h1 { font-size: 1.8rem; text-align: center; color: #4CAF50; margin: 10px 0; }
        .status-banner { font-size: 1.5rem; font-weight: bold; text-align: center; background: #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; color: #FFEB3B; }
        .closed { background: #F44336 !important; color: white !important; }
        .section-title { font-size: 1.4rem; border-bottom: 2px solid #555; padding-bottom: 5px; margin-top: 30px; color: #bbb; }
        .total-list { list-style: none; padding: 0; margin: 0; }
        .total-item { font-size: 1.6rem; font-weight: bold; background: #1E1E1E; margin-bottom: 10px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #2196F3; }
        .total-count { color: #FF9800; font-size: 1.8rem; }
        .history-container { margin-top: 20px; }
        .history-slot { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .history-title { font-size: 1.2rem; font-weight: bold; color: #8BC34A; margin-bottom: 10px; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-list li { font-size: 1.2rem; display: flex; justify-content: space-between; margin-bottom: 5px; color: #ddd; }
    </style>
</head>
<body>
    <h1 id="today-date">오늘의 MF 발주</h1>
    <label for="order-date">조회 날짜</label>
    <input id="order-date" type="date" style="font-size:1.1rem;padding:8px;margin:8px 0 16px">
    <div id="status-banner" class="status-banner">데이터 대기 중...</div>

    <div class="section-title">🔥 최종 합계 (누적 총합)</div>
    <ul id="total-list" class="total-list"></ul>

    <div class="section-title">🕒 시간대별 입력 내역</div>
    <div id="history-container" class="history-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCpgZGJ21HdGs36tGuvZgF7sPIbRXNPr0",
            authDomain: "coupang-mf.firebaseapp.com",
            databaseURL: "https://coupang-mf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "coupang-mf",
            storageBucket: "coupang-mf.firebasestorage.app",
            messagingSenderId: "12362663151",
            appId: "1:12362663151:web:51e7acce47f166a88b871a",
            measurementId: "G-JBKQVKJXRE"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // KST(한국 시간) 기준으로 정확한 날짜(YYYY-MM-DD) 구하기
        function getTodayKST() {
            const curr = new Date();
            const utc = curr.getTime() + (curr.getTimezoneOffset() * 60 * 1000);
            const kstGap = 9 * 60 * 60 * 1000;
            const kstDate = new Date(utc + kstGap);
            
            const year = kstDate.getFullYear();
            const month = String(kstDate.getMonth() + 1).padStart(2, '0');
            const day = String(kstDate.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day}`;
        }

        const dateInput = document.getElementById('order-date');
        dateInput.value = getTodayKST();
        let activeRef = null;
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }
        function showDate() {
          if (activeRef) activeRef.off();
          const selectedDate = dateInput.value;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) return;
          document.getElementById('today-date').innerText = `${selectedDate} MF 발주`;
          activeRef = db.ref('mf_orders/' + selectedDate);
          activeRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const totalListEl = document.getElementById('total-list');
            const historyContainerEl = document.getElementById('history-container');
            const statusBanner = document.getElementById('status-banner');
            
            totalListEl.innerHTML = '';
            historyContainerEl.innerHTML = '';

            if (data && data.slots) {
                statusBanner.innerText = data.lastStatus || "진행 중";
                if (data.lastStatus && data.lastStatus.includes('마감')) {
                    statusBanner.classList.add('closed');
                } else {
                    statusBanner.classList.remove('closed');
                }

                let totalItems = {}; 
                let grandTotalCount = 0;
                const slotKeys = Object.keys(data.slots).sort();
                
                slotKeys.forEach(key => {
                    const slotData = data.slots[key];
                    const items = slotData.items || {};
                    
                    for (const [name, count] of Object.entries(items)) {
                        const val = parseInt(count) || 0;
                        if (!totalItems[name]) totalItems[name] = 0;
                        totalItems[name] += val;
                        grandTotalCount += val;
                    }

                    let historyHtml = `<div class="history-slot"><div class="history-title">${escapeHtml(slotData.label || key)}</div><ul class="history-list">`;
                    for (const [name, count] of Object.entries(items)) {
                        historyHtml += `<li><span>${escapeHtml(name)}</span> <span>${Number(count) || 0}건</span></li>`;
                    }
                    historyHtml += `</ul></div>`;
                    historyContainerEl.innerHTML += historyHtml;
                });

                // 품목별 누적 합계 표시
                for (const [name, count] of Object.entries(totalItems).sort((a,b)=>a[0].localeCompare(b[0],'ko'))) {
                    totalListEl.innerHTML += `
                        <li class="total-item">
                            <span class="item-name">* ${escapeHtml(name)}</span> 
                            <span class="total-count">${count}건</span>
                        </li>`;
                }

                // 총 건수 카드 추가
                totalListEl.innerHTML += `
                    <li class="total-item" style="background: #1e2a38; border-left-color: #FF9800;">
                        <span class="item-name" style="color: #FFEB3B;">총건수</span> 
                        <span class="total-count" style="color: #FFEB3B;">${grandTotalCount}건</span>
                    </li>`;

            } else {
                statusBanner.innerText = "아직 등록된 발주가 없습니다.";
                statusBanner.classList.remove('closed');
            }
          }, error => {
            document.getElementById('status-banner').innerText = '데이터를 읽지 못했습니다: ' + error.message;
          });
        }
        dateInput.addEventListener('change', showDate);
        showDate();
    </script>
</body>
</html>
